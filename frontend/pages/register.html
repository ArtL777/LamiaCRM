<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — LamiaCRM</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <header id="navbar"></header>

    <main class="auth-page">
        <div class="card">
            <h1 class="auth-title">Регистрация</h1>
            <p class="auth-subtitle">Создайте аккаунт, чтобы продолжить</p>

            <div class="alert alert-error" id="error-box"></div>

            <form id="register-form">
                <div class="form-group">
                    <label for="username">Логин</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="email">Почта</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="6">
                        <button type="button" class="password-toggle" data-target="password"></button>
                    </div>
                    <div class="form-hint">Не менее 6 символов</div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
                </div>
            </form>

            <p class="auth-switch">Уже есть аккаунт? <a href="/pages/login.html">Войти</a></p>
        </div>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/nav.js"></script>
    <script src="/assets/js/password-toggle.js"></script>
    <script src="/assets/js/register.js"></script>
</body>
</html>

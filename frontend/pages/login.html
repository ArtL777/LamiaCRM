<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — LamiaCRM</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <header id="navbar"></header>

    <main class="auth-page">
        <div class="card">
            <h1 class="auth-title">Вход</h1>
            <p class="auth-subtitle">Рады видеть вас снова</p>

            <div class="alert alert-error" id="error-box"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="identifier">Логин или почта</label>
                    <input type="text" id="identifier" name="identifier" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" data-target="password"></button>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-block">Войти</button>
                </div>
            </form>

            <p class="auth-switch">Ещё нет аккаунта? <a href="/pages/register.html">Зарегистрироваться</a></p>
        </div>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/nav.js"></script>
    <script src="/assets/js/password-toggle.js"></script>
    <script src="/assets/js/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — LamiaCRM</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <header id="navbar"></header>

    <main class="page">
        <a href="/" class="back-link" id="back-link">&larr; Назад</a>
        <h1 class="page-title">Профиль</h1>

        <div class="card">
            <div class="alert alert-error" id="error-box"></div>
            <div class="alert alert-success" id="success-box"></div>

            <form id="profile-form">
                <div class="form-group">
                    <label for="username">Логин</label>
                    <input type="text" id="username" name="username">
                </div>
                <div class="form-group">
                    <label for="email">Почта</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="form-group">
                    <label for="password">Новый пароль</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" placeholder="Оставьте пустым, если не хотите менять">
                        <button type="button" class="password-toggle" data-target="password"></button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="currentPassword">Текущий пароль (для подтверждения)</label>
                    <div class="password-field">
                        <input type="password" id="currentPassword" name="currentPassword" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" data-target="currentPassword"></button>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                    <button type="button" class="btn btn-outline" id="logout-btn">Выйти из аккаунта</button>
                </div>
            </form>
        </div>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/nav.js"></script>
    <script src="/assets/js/password-toggle.js"></script>
    <script src="/assets/js/profile.js"></script>
</body>
</html>
